name: Full link check

on:
  workflow_dispatch: {}   # run it by hand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test every link
        run: |
          python scripts/full_check.py links.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue with the full list
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Verificación completa $(date +%Y-%m-%d)" --body-file report.md
